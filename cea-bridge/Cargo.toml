[package]
name = "cea-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "JSON stdin/stdout bridge for CEA (causal edit attribution) integration with Hermes Agent"

[dependencies]
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[workspace]
