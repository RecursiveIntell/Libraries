[package]
name = "context-governor-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for context-governor"

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
context-governor = { path = "../context-governor" }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
