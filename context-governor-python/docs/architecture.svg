<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">context-governor-python compaction flow</title>
  <desc id="desc">A JSON transcript, session id, and target token budget enter the compaction engine. The compacted transcript and a typed receipt (token savings, BLAKE3 digest, warnings) are returned.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="24" fill="#07111F"/>
  <rect width="1200" height="580" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">CONTEXT-GOVERNOR COMPACTION</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">PyO3 bindings over the Rust compaction engine · receipt-bearing, budget-aware context reduction</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260H540"/>
      <path d="M700 260H780"/>
    </g>

    <!-- Inputs -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">INPUTS</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="11">messages · session</text>
    <text x="129" y="295" text-anchor="middle" fill="#C4B5FD" font-size="11">target · protect</text>

    <!-- Bindings -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">PYO3</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="14">compact()</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">JSON in/out</text>

    <!-- Engine -->
    <rect x="420" y="206" width="120" height="108" rx="12" fill="#11271F" stroke="#34D399" stroke-width="2"/>
    <text x="440" y="240" fill="#6EE7B7" font-size="12" font-weight="700">RUST ENGINE</text>
    <text x="440" y="268" fill="#ECFDF5" font-size="13">context-governor</text>
    <text x="440" y="292" fill="#94A3B8" font-size="11">CompactionPolicy</text>

    <!-- Receipt -->
    <rect x="540" y="206" width="160" height="108" rx="12" fill="#211E13" stroke="#FBBF24" stroke-width="2"/>
    <text x="560" y="240" fill="#FDE68A" font-size="12" font-weight="700">COMPACTION RECEIPT</text>
    <text x="560" y="268" fill="#FEF3C7" font-size="12">token savings</text>
    <text x="560" y="290" fill="#FEF3C7" font-size="12">blake3 digest</text>
    <text x="560" y="312" fill="#FEF3C7" font-size="12">warnings</text>

    <!-- Output -->
    <rect x="780" y="206" width="364" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="240" fill="#C4B5FD" font-size="12" font-weight="700">COMPACTED TRANSCRIPT</text>
    <text x="800" y="268" fill="#EDE9FE" font-size="13">messages · counts · tokens</text>
    <text x="800" y="292" fill="#DDD6FE" font-size="11">protect-first/last honored</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">USE CASE</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">Hermes context compaction — shrink long transcripts to a target budget while protecting recent and leading turns</text>
  </g>
</svg>
