[advisories]
version = 2
yanked = "warn"
# Deferred 2026-11-11 per the operator decision recorded in
# docs/supply-chain-deferral-2026-11-11.md (review 2027-05): both have no
# patched release upstream; unmaintained = no maintenance, not a known
# vulnerability in this usage.
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3 — team ceased development; v1.3.3 declared complete
    "RUSTSEC-2024-0436", # paste 1.0.15 — via simba -> nalgebra; transitive
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
