# cargo-deny configuration for the Libraries workspace root.
#
# Advisory policy per the operator decision of 2026-11-11 (see
# docs/supply-chain-deferral-2026-11-11.md):
# - vulnerabilities, unsound, and yanked advisories FAIL the check;
# - unmaintained advisories for which no patched version exists are
#   explicitly ignored here with a deferral record, owner, and review date.
# Any new advisory not listed below still fails the check.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Deferred 2026-11-11, review 2027-05. Transitive: bincode 1.3.3 (direct dep
    # of Primitives/cea-core, fib-quant; no patched release; alternatives listed
    # in the deferral record). Unmaintained = no upstream maintenance, not a
    # known vulnerability.
    "RUSTSEC-2025-0141", # bincode — cea-core, fib-quant
    # Deferred 2026-11-11, review 2027-05. Transitive: paste via simba ->
    # nalgebra -> statrs/fib-quant. Drop-in replacement exists (pastey) but the
    # swap is inside third-party crates we do not own.
    "RUSTSEC-2024-0436", # paste — simba/nalgebra chain
    # Deferred 2026-11-11, review 2027-05. Transitive: proc-macro-error via
    # glib/gtk 0.18 -> tauri v2 desktop shells. Re-evaluate on any tauri major
    # bump.
    "RUSTSEC-2024-0370", # proc-macro-error — gtk/glib -> tauri
    # Deferred 2026-11-11, review 2027-05. glib 0.18.5 VariantStrIter iterator
    # unsoundness (RUSTSEC-2024-0429): patched only in the glib 0.20/gtk 0.20
    # stack, which tauri v2 pins to 0.18. Same exit criterion as the tauri
    # chain above: re-evaluate on any tauri major bump.
    "RUSTSEC-2024-0429", # glib — gtk 0.18 -> tauri
    # Deferred 2026-11-11, review 2027-05. Transitive: unic 0.9 chain via
    # urlpattern -> tauri-utils -> tauri v2. Upstream recommends icu_properties;
    # the migration is inside tauri, not this workspace.
    "RUSTSEC-2025-0075", # unic-char-range — tauri
    "RUSTSEC-2025-0080", # unic-common — tauri
    "RUSTSEC-2025-0081", # unic-char-property — tauri
    "RUSTSEC-2025-0098", # unic-ucd-version — tauri
    "RUSTSEC-2025-0100", # unic-ucd-ident — tauri
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
