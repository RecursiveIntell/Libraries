# cargo-deny baseline for ~/Coding/Libraries
# Generated: 2026-06-02 (post-V30 audit)
# Owner: Workspace tooling
#
# This config is intentionally permissive on its first commit. It will:
#   - FAIL on known security advisories (CVEs / RUSTSEC)  ← non-negotiable
#   - FAIL on yanked crate versions
#   - DENY unknown registries, unknown git sources, and wildcard dependencies
#   - WARN on unmaintained crates, multiple versions, copyleft licenses, etc.
#
# Do NOT soften the advisory, source, or wildcard gates without a dated,
# owner-approved entry in the exception ledger below.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Ignored advisories (with rationale):
#
# --- Unmaintained transitive crates (HARDENING, not exploitable) ---
# All RUSTSEC-2024-0411..0420: gtk3-rs / gtk-rs GTK3 bindings
#   Transitive from tauri-runtime-wry → webkit2gtk-gtk3. Tauri 2.x still
#   targets GTK3 on Linux. Fix requires Tauri upstream to ship a webkit2gtk-gtk4
#   backend; tracked in tauri-apps/tauri issue tracker.
# RUSTSEC-2024-0370 (proc-macro-error 1.0.4): transitive from glib-macros →
#   glib → gtk → Tauri 2.x. The active fork is `proc-macro-error2`, but Tauri
#   has not migrated the gtk-rs bindings to it.
# RUSTSEC-2024-0436 (paste): transitive from rav1e → ravif → image (Tauri bundler
#   image pipeline). No safe upgrade available on the affected version range.
# RUSTSEC-2025-0075 / -0080 / -0081 / -0098 / -0100 (unic-*): transitive from
#   urlpattern → tauri-utils. No upstream migration planned by Tauri as of 2.11.2.
#
# Reference: Tauri 2.11.2 release notes acknowledge all of the above as known
# "unmaintained warnings" in their own cargo-audit output.
#
# --- bincode: REMOVED 2026-06-02 ---
# RUSTSEC-2025-0141 (bincode project unmaintained) was previously
# silenced here. The only direct dep (cea-core) migrated to postcard
# 1.1 in this session's commit, and the hnsw_rs transitive was
# eliminated in 121d940 (the semantic-memory default switch).
# The default workspace graph remains free of bincode, but the all-features
# release graph can still reach it through semantic-memory's optional hnsw
# feature. The advisory is intentionally not ignored, so that release graph
# remains blocked until the optional transitive path is removed.
# Exception ledger. Every ignored advisory has an owner and a mandatory expiry.
# Renewal requires re-verifying the transitive path and the absence of an
# upstream-safe upgrade. Owner for all entries: Workspace Security.
ignore = [
    "RUSTSEC-2024-0411", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0412", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0413", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0414", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0415", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0416", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0417", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0418", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0419", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0420", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0370", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2024-0436", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2025-0075", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2025-0080", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2025-0081", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2025-0098", # owner: Workspace Security; expires: 2026-12-31
    "RUSTSEC-2025-0100", # owner: Workspace Security; expires: 2026-12-31
]
# Vulnerability-grade advisories (soundness issues, RCE, etc.) are NOT ignored
# under any circumstance. As of this config's authoring, RUSTSEC-2026-0097
# (rand 0.9.2 unsound) and RUSTSEC-2026-0104 (rustls-webpki CRL panic) had
# been fixed via `cargo update -p rand` and `cargo update -p rustls-webpki`.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Note: cargo-deny 0.19 removed the top-level `copyleft` key. Copyleft is now
# controlled per-license via the `allow` list. If a copyleft crate slips
# in, it'll appear in the warnings section under licenses.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Common legitimate skip tree; extend as needed.
skip = []
skip-tree = []

[sources]
# cargo-deny's effective unknown-source policy is the combination of these two
# source-kind settings; cargo-deny has no singular `unknown-source` key.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
