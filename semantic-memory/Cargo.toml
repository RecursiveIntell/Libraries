[package]
name = "semantic-memory"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
description = "Hybrid semantic search with SQLite, FTS5, and HNSW — built for AI agents"
license = "Apache-2.0"
repository = "https://www.github.com/recursiveintell/semantic-memory"
homepage = "https://www.github.com/recursiveintell/semantic-memory"
keywords = ["search", "semantic", "sqlite", "hnsw", "embeddings"]
categories = ["database", "text-processing"]
readme = "README.md"

[features]
default = ["hnsw"]
hnsw = ["dep:hnsw_rs"]
brute-force = []
testing = []
turbo-quant-codec = ["dep:turbo-quant", "dep:quant-governor", "dep:scr-runtime-compression"]
fib-quant-codec = ["dep:fib-quant", "dep:scr-runtime-compression"]
poly-kv-codec = ["dep:poly-kv"]
per-dim-codec = ["dep:compressed-scorer"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
rusqlite = { workspace = true, features = ["bundled", "blob"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
stack-ids = { version = "0.1.1", path = "../stack-ids" }
forge-memory-bridge = { version = "0.1.1", path = "../forge-memory-bridge" }
schemars = { workspace = true }
boundary-compiler = { version = "0.1.0", path = "../boundary-compiler" }
bitemporal-runtime = { version = "0.1.0", path = "../bitemporal-runtime" }

# HNSW approximate nearest neighbor search (optional)
hnsw_rs = { version = "0.3", optional = true }
turbo-quant = { version = "0.2.0", path = "../turbo-quant", optional = true }
quant-governor = { path = "../quant-governor", optional = true }
scr-runtime-compression = { path = "../scr-runtime-compression", optional = true }
poly-kv = { version = "0.1.0-alpha.1", path = "../poly-kv/crates/poly-kv", optional = true }
fib-quant = { path = "../fib-quant", optional = true }
compressed-scorer = { version = "0.1.0", optional = true }


[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
semantic-memory-forge = { version = "0.1.1", path = "../semantic-memory-forge" }

[[example]]
name = "verify_fib_quant"
required-features = ["fib-quant-codec"]

[[example]]
name = "verify_per_dim"
required-features = ["per-dim-codec"]

[[example]]
name = "verify_per_dim_fast"
required-features = ["per-dim-codec"]

[[example]]
name = "gen_fib_artifacts"
required-features = ["fib-quant-codec"]

[[example]]
name = "gen_per_dim"
required-features = ["per-dim-codec"]

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
