[package]
name = "semantic-memory"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Hybrid semantic search with SQLite, FTS5, and HNSW — built for AI agents"
license = "Apache-2.0"
repository = "https://www.github.com/recursiveintell/semantic-memory"
homepage = "https://www.github.com/recursiveintell/semantic-memory"
keywords = ["search", "semantic", "sqlite", "hnsw", "embeddings"]
categories = ["database", "text-processing"]
readme = "README.md"

[features]
# Default backend: hnsw_rs 0.3 (existing behavior). The usearch 2.25 backend
# is being added; once it stabilizes the default will switch. Both can be
# enabled simultaneously; the runtime picks based on the feature gate.
default = ["hnsw"]
# New backend (not yet wired in): usearch 2.25 — high-performance single-file
# vector search, cxx-bridge to C++. Replacement for hnsw_rs 0.3 once it
# stabilizes. Adds cxx + cxx-build build deps. See
# HNSW_RESEARCH_2026-06-02.md.
usearch-backend = ["dep:usearch", "dep:cxx-build", "dep:cxx"]
# Legacy hnsw_rs 0.3 backend. Default for now; opt-in for callers that want
# the previous behavior. bincode 1.3.3 advisory applies only when this
# feature is enabled.
hnsw = ["dep:hnsw_rs"]
# Pure-Rust brute-force backend (no ANN). Useful for small corpora and as
# a fallback when no compiled C++ toolchain is available.
brute-force = []
testing = []
turbo-quant-codec = ["dep:turbo-quant", "dep:quant-governor", "dep:scr-runtime-compression"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
blake3 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "blob"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
stack-ids = { version = "0.1.1", path = "../stack-ids" }
forge-memory-bridge = { version = "0.1.1", path = "../forge-memory-bridge" }
schemars = { workspace = true }
boundary-compiler = { version = "0.1.0", path = "../boundary-compiler" }
bitemporal-runtime = { version = "0.1.0", path = "../bitemporal-runtime" }

# Vector search backends. Only one is active at a time (enforced by feature
# flag; trying to enable both `hnsw` and `usearch-backend` simultaneously is
# allowed but the runtime will pick the first that matches the feature gate).
hnsw_rs = { version = "0.3", optional = true }
usearch = { version = "2.25", default-features = false, optional = true }
turbo-quant = { version = "0.2.0", path = "../turbo-quant", optional = true }
quant-governor = { path = "../quant-governor", optional = true }
scr-runtime-compression = { path = "../scr-runtime-compression", optional = true }

[build-dependencies]
# cxx-build is only needed when the usearch backend is enabled (it triggers
# the C++ bridge compilation). Declared unconditionally so the build script
# can switch behavior based on the active feature.
cxx-build = { version = "1.0", optional = true }
cxx = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
semantic-memory-forge = { version = "0.1.1", path = "../semantic-memory-forge" }

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
