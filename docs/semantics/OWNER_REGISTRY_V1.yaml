archived_policy:
  mutation: forbidden_except_explicit_revival
  semantic_owner_status: none
  history: preserve
  note: "Archived repositories may document supersession but do not receive semantic migrations."

upstream_fork_policy:
  rule: >-
    Do not rewrite upstream semantics solely to satisfy RecursiveIntell vocabulary.
    Apply the semantic law to RecursiveIntell-authored boundaries, adapters, claims,
    receipts, and patches while preserving upstream contracts.

adoption:
  phase_0:
    name: agree_and_register
    runtime_changes: false
  phase_1:
    name: source_owner_reconciliation
    gate: "every active duplicate package has exactly one canonical editable source"
  phase_2:
    name: identity_digest_v2
    gate: "canonical structured digest ownership is unambiguous and V1 remains readable"
  phase_3:
    name: receipt_authority_outcome_normalization
  phase_4:
    name: time_replay_generation_normalization
  phase_5:
    name: consumer_docs_and_api_migrations
  phase_6:
    name: cross_repo_ci_enforcement
