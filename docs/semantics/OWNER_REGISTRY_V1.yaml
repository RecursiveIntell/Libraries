semantic_law: recursiveintell.semantic-law/v1
status: proposal
governance_owner: RecursiveIntell/Libraries
rule: >-
  Concept ownership and source-code ownership are separate. A concept may have one
  semantic owner while duplicated source locations remain reconciliation_required.
  No unresolved duplicate is promoted by this registry.

role_definitions:
  governance_owner: owns the cross-repository semantic law and owner registry
  semantic_owner: owns a cross-stack semantic family
  domain_owner: owns semantics for one bounded product/research domain
  consumer_product: consumes shared semantics and owns only product-local state
  integration_distribution: packages/adapts owner semantics without redefining them
  tooling: build/audit/archive/utility tooling without cross-stack semantic ownership
  upstream_fork: externally owned/upstream project; RecursiveIntell law applies only to local integration boundaries
  collection_mirror: duplicate/collection source; must not independently define shared semantics
  archived_frozen: historical source; no new semantic ownership
  unclassified_active: active repository with no observed cross-stack semantic ownership; must declare before adding one

