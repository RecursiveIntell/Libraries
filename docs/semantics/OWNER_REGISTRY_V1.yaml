known_semantic_drifts:
  - id: DIGEST-001
    severity: high
    issue: >-
      stack-ids compute_json calls sorted-key serde JSON canonical while boundary-compiler
      owns RFC 8785 JCS canonicalization. Both expose ContentDigest semantics.
    disposition: V2 contract required; do not silently rewrite V1 digests.
  - id: TIME-001
    severity: medium
    issue: >-
      bitemporal-runtime documentation describes valid_time as when a value is true;
      v1 should normalize this to declared/effective domain time unless stronger truth is proven.
    disposition: documentation normalization; preserve wire fields.
  - id: RECEIPT-001
    severity: high
    issue: >-
      receipt is overloaded across hashes, HMAC-authenticated execution records,
      transition records, benchmark records, control records, and observations.
    disposition: qualify receipt families and their predicates; no universal success implication.
  - id: OWNER-001
    severity: high
    issue: >-
      owner is overloaded across semantic owner, state writer, execution host,
      profile/device/resource owner, and operator.
    disposition: qualified owner vocabulary required at cross-repository boundaries.
  - id: AUTH-001
    severity: high
    issue: >-
      identity/provenance/authentication/approval/permit concepts are close enough to be
      accidentally promoted into authority.
    disposition: preserve explicit grant -> approval/policy -> current permit -> execution separation.
  - id: UUID-001
    severity: medium
    issue: >-
      recursive-agent doctrine forbids random UUIDs as material IDs while stack-ids
      intentionally supports UUIDv4 opaque object IDs.
    disposition: restrict the prohibition to content/material identity; typed object IDs may use UUIDv4.
  - id: REPLAY-001
    severity: high
    issue: >-
      replay can mean recorded artifact replay, deterministic re-execution, checkpoint resume,
      or journal replication replay.
    disposition: qualify replay kind; effect retry is never replay.
  - id: SOURCE-001
    severity: critical
    issue: >-
      active copies of the same packages differ across Libraries, standalone repos, and
      collection repos, sometimes at the same package version.
    disposition: assign one canonical editable source per package and enforce one-way mirrors.

