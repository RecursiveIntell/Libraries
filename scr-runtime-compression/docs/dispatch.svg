<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">scr-runtime-compression dispatch and fallback</title>
  <desc id="desc">A compressed search path carries a codec id. Runtime dispatch selects the codec adapter, which delegates to turbo-quant or fib-quant, with exact fallback to raw f32 on decode.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#07111F"/>
  <rect width="1200" height="600" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">RUNTIME COMPRESSION DISPATCH</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">integration layer delegates to turbo-quant / fib-quant · this crate never owns codec truth</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260H520"/>
      <path d="M520 260V180H660"/>
      <path d="M520 260V340H660"/>
      <path d="M520 260H660" stroke-dasharray="7 7"/>
      <path d="M820 260H900"/>
      <path d="M520 440V480H900"/>
    </g>

    <!-- Path -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">SEARCH PATH</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="12">compressed repr + codec id</text>

    <!-- Dispatch -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">CODEC DISPATCH</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="14">select_codec</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">codec id discriminates</text>

    <!-- Adapter -->
    <rect x="420" y="206" width="180" height="108" rx="12" fill="#11271F" stroke="#34D399" stroke-width="2"/>
    <text x="440" y="240" fill="#6EE7B7" font-size="12" font-weight="700">EXACT FALLBACK</text>
    <text x="440" y="268" fill="#ECFDF5" font-size="14">decode adapter</text>
    <text x="440" y="292" fill="#94A3B8" font-size="11">requires exact decode</text>

    <!-- Codecs -->
    <rect x="660" y="126" width="160" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="680" y="160" fill="#F9A8D4" font-size="12" font-weight="700">TURBO-QUANT</text>
    <text x="680" y="188" fill="#FCE7F3" font-size="14">polar + residual</text>
    <text x="680" y="212" fill="#FBCFE8" font-size="11">delegated, not owned</text>

    <rect x="660" y="260" width="160" height="108" rx="12" fill="#162318" stroke="#84CC16" stroke-width="2"/>
    <text x="680" y="294" fill="#BEF264" font-size="12" font-weight="700">FIB-QUANT</text>
    <text x="680" y="322" fill="#ECFCCB" font-size="14">radial-angular</text>
    <text x="680" y="346" fill="#94A3B8" font-size="11">delegated, not owned</text>

    <rect x="660" y="394" width="160" height="108" rx="12" fill="#211E13" stroke="#FBBF24" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="680" y="428" fill="#FDE68A" font-size="12" font-weight="700">UNCOMPRESSED</text>
    <text x="680" y="456" fill="#FEF3C7" font-size="14">identity pass-through</text>
    <text x="680" y="480" fill="#94A3B8" font-size="11">no fallback needed</text>

    <!-- Output -->
    <rect x="900" y="206" width="244" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="920" y="240" fill="#C4B5FD" font-size="12" font-weight="700">DECODED OUTPUT</text>
    <text x="920" y="268" fill="#EDE9FE" font-size="14">raw f32 representation</text>
    <text x="920" y="292" fill="#DDD6FE" font-size="11">exact, no silent degradation</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">DESIGN INVARIANT</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">no unwrap in production paths · all fallible operations return Result or Option · MSRV 1.75</text>
  </g>
</svg>
