[package]
name = "scr-runtime-compression"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Runtime integration adapter for semantic-memory compression layer — CompressedSearchPath and ExactFallbackAdapter delegates to turbo-quant/fib-quant"
license = "MIT"
authors = ["Libraries Authors"]
repository = "https://github.com/RecursiveIntell/Libraries"
keywords = ["compression", "runtime", "semantic-memory", "quantization", "adapter"]
categories = ["compression", "encoding"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
quant-governor = { version = "0.1.1", path = "../quant-governor" }

# Optional codec dependencies — brought in by feature flags
turbo-quant = { version = "0.2.0", path = "../turbo-quant", optional = true }
fib-quant = { version = "0.1.0-beta.1", path = "../fib-quant", optional = true }

[features]
default = ["turbo", "fib"]
turbo = ["dep:turbo-quant"]
fib = ["dep:fib-quant"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[lib]
path = "src/lib.rs"