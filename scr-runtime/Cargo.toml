[workspace]
resolver = "2"
members = [
    "crates/scr-audit-adapter",
    "crates/scr-cli",
    "crates/scr-kernel",
    "crates/scr-reference",
]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
expect_used = { level = "warn", priority = -1 }

[workspace.dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
blake3 = "1"
