[package]
name = "federated-settlement"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Typed treaty and settlement surface crate with bounded shared-view evaluators; not a network runtime"
license = "MIT"

[dependencies]
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
stack-ids = { version = "0.1.1", path = "../stack-ids" }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
