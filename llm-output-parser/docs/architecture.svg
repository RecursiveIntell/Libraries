<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">llm-output-parser extraction pipeline</title>
  <desc id="desc">Raw LLM output is cleaned of think blocks and fences, then a parser extracts typed JSON, lists, XML, choices, numbers, or text. Traced variants return a diagnostic trace.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#07111F"/>
  <rect width="1200" height="600" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">LLM OUTPUT EXTRACTION</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">no additional LLM call · handles think blocks, markdown fences, malformed JSON, and real model output</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260V186H540"/>
      <path d="M420 260V246H540"/>
      <path d="M420 260V306H540"/>
      <path d="M420 260V366H540"/>
      <path d="M700 260H780"/>
    </g>

    <!-- Output -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">LLM OUTPUT</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="11">think · fences · noise</text>

    <!-- Clean -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">CLEAN</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="13">strip think tags</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">strip fences</text>

    <!-- Parsers -->
    <rect x="420" y="132" width="120" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="440" y="166" fill="#F9A8D4" font-size="12" font-weight="700">JSON</text>
    <text x="440" y="194" fill="#FCE7F3" font-size="13">typed / untyped</text>
    <text x="440" y="218" fill="#FBCFE8" font-size="11">parse_json*</text>

    <rect x="420" y="246" width="120" height="108" rx="12" fill="#162318" stroke="#84CC16" stroke-width="2"/>
    <text x="440" y="280" fill="#BEF264" font-size="12" font-weight="700">LIST</text>
    <text x="440" y="308" fill="#ECFCCB" font-size="13">string lists</text>
    <text x="440" y="332" fill="#94A3B8" font-size="11">clean / raw</text>

    <rect x="420" y="360" width="120" height="108" rx="12" fill="#211E13" stroke="#FBBF24" stroke-width="2"/>
    <text x="440" y="394" fill="#FDE68A" font-size="12" font-weight="700">SCALAR</text>
    <text x="440" y="422" fill="#FEF3C7" font-size="13">choice · number</text>
    <text x="440" y="446" fill="#94A3B8" font-size="11">xml · text · yaml</text>

    <!-- Result -->
    <rect x="540" y="206" width="160" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="560" y="240" fill="#C4B5FD" font-size="12" font-weight="700">VALUE + TRACE</text>
    <text x="560" y="268" fill="#EDE9FE" font-size="13">typed result</text>
    <text x="560" y="292" fill="#DDD6FE" font-size="11">with_trace variants</text>

    <!-- Output -->
    <rect x="780" y="206" width="364" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="240" fill="#C4B5FD" font-size="12" font-weight="700">STRUCTURED DATA</text>
    <text x="800" y="268" fill="#EDE9FE" font-size="13">no extra LLM call</text>
    <text x="800" y="292" fill="#DDD6FE" font-size="11">deterministic extraction</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">RELIABILITY</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">repairs malformed JSON without a model call · every traced variant exposes a diagnostic ParseTrace</text>
  </g>
</svg>
