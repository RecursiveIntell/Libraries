[package]
name = "claim-ledger"
version = "0.2.0"
edition = "2021"
description = "Deterministic, local-first claim/evidence/provenance ledger. Creates receipts for all material operations."
license = "MIT"
authors = ["Josh Stevenson <j.stevenson.cs@gmail.com>"]
keywords = ["claims", "provenance", "evidence", "ledger"]
categories = ["data-structures"]
repository = "https://github.com/RecursiveIntell/Libraries"
homepage = "https://github.com/RecursiveIntell/Libraries"
documentation = "https://docs.rs/claim-ledger"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ulid = "1.1"
hex = "0.4"
ring = "0.17"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
