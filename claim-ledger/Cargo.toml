[package]
name = "claim-ledger"
version = "0.1.0"
edition = "2021"
description = "Deterministic, local-first claim/evidence/provenance ledger. Creates receipts for all material operations."
license = "MIT"
keywords = ["claims", "provenance", "evidence", "ledger"]
categories = ["data-structures", "verification"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
blake3 = "1.8"
ulid = "1.1"
hex = "0.4"
digest = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }