[package]
name = "recursive-kernel-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Non-authoritative recursive inference kernel schemas and operator contracts"
license = "MIT"

[dependencies]
serde = { workspace = true, features = ["derive"] }
stack-ids = { path = "../stack-ids" }
schemars = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
