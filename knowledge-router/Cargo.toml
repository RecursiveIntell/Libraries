[package]
name = "knowledge-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "JSON stdin/stdout CLI wrapping knowledge-runtime's classify() and plan() for Hermes Agent integration"

[dependencies]
knowledge-runtime = { version = "0.1.0", path = "../knowledge-runtime" }
stack-ids = { version = "0.1.1", path = "../stack-ids" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[workspace]