[package]
name = "hyperquant"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Experimental lattice quantization primitives with explicit receipts and conservative claim boundaries"
license = "MIT OR Apache-2.0"
authors = ["sikmindz"]
readme = "README.md"
repository = "https://github.com/RecursiveIntell/Libraries"
homepage = "https://github.com/RecursiveIntell/Libraries"
documentation = "https://docs.rs/hyperquant"
keywords = ["quantization", "lattice", "compression", "vectors", "receipts"]
categories = ["compression", "science", "algorithms", "mathematics"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
    "tests/**",
]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
