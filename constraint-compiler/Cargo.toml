[package]
name = "constraint-compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Deterministic projection-to-inference graph compiler for the recursive inference kernel"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RecursiveIntell/constraint-compiler"
homepage = "https://github.com/RecursiveIntell/constraint-compiler"
documentation = "https://docs.rs/constraint-compiler"
keywords = ["constraint", "compiler", "inference", "projection", "deterministic"]
categories = ["algorithms", "compilers"]

[dependencies]
blake3 = { workspace = true }
forge-memory-bridge = { version = "0.1.1", path = "../forge-memory-bridge" }
recursive-kernel-core = { version = "0.1.0", path = "../recursive-kernel-core" }
semantic-memory-forge = { version = "0.1.1", path = "../semantic-memory-forge" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stack-ids = { version = "0.1.1", path = "../stack-ids" }
schemars = { workspace = true }

[dev-dependencies]

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
