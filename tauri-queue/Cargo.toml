[package]
name = "tauri-queue"
version = "0.3.0"
edition = "2021"
authors = ["Josh"]
license = "MIT"
description = "Tauri integration for job-queue background job processing"
readme = "README.md"
keywords = ["tauri", "queue", "jobs", "background", "async"]
categories = ["asynchronous", "database"]

[dependencies]
job-queue = { version = "0.2.0", path = "../job-queue" }
tauri = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stack-ids = { version = "0.1.1", path = "../stack-ids" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["sqlite"]
sqlite = []

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "with_cooldown"
path = "examples/with_cooldown.rs"

[[example]]
name = "with_cancellation"
path = "examples/with_cancellation.rs"

[[example]]
name = "with_persistence"
path = "examples/with_persistence.rs"
