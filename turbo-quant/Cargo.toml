[package]
name = "turbo-quant"
version = "0.2.3"
edition = "2021"
rust-version = "1.75.0"
description = "Experimental codec substrate: PolarQuant angular quantization, TurboQuant with QJL residual sketches, and bit-packed wire formats. Includes KV-cache shadow mode. NOT a vector-search sidecar — see docs/codex-runs/P27/REAL_BENCH_AUDIT.md"
license = "MIT OR Apache-2.0"
authors = ["sikmindz"]
readme = "README.md"
repository = "https://github.com/RecursiveIntell/turbo-quant"
homepage = "https://github.com/RecursiveIntell/turbo-quant"
documentation = "https://docs.rs/turbo-quant"
keywords = ['quantization', 'compression', 'embeddings', 'kv-cache', 'codec']
categories = ["science", "algorithms", "compression", "mathematics", "database"]
exclude = [
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "codex/",
    "prompts/",
    "p33boot/",
    "governor/",
    "schemas/",
    "scripts/",
    "templates/",
    "tools/semantic_memory_harness/",
    "docs/codex-runs/",
    "docs/release-evidence/",
    "target/",
    "*.zip",
    "*.codex-archive.json",
    "*.manifest.json",
    "*.findings.json",
    "*.excluded.json",
    "*.report.md",
]

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
nalgebra = { version = "0.33", features = ["serde-serialize"] }

[features]
default = []

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "turbo_quant_search"
harness = false
