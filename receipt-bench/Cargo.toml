[package]
name = "receipt-bench"
version = "0.1.0"
edition = "2021"
description = "Replayable benchmark substrate for semantic search, compression, and memory operations"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sikmindz/receipt-bench"
keywords = ["benchmark", "receipt", "provenance", "replay"]
categories = ["development-tools", "benchmarking"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[features]
sm-adapter = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "sm-bench"
path = "src/bin/sm_bench.rs"
required-features = ["sm-adapter"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"