[package]
name = "aidens-testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Independent reference interpreters for semantic conformance tests"


[dependencies]
aidens-contracts = { path = "../aidens-contracts" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
