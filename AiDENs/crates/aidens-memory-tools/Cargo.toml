[package]
name = "aidens-memory-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Native semantic-memory, knowledge-runtime, and claim-ledger tools for AiDENs agents"

[lib]
doctest = false

[dependencies]
aidens-tool-kit = { path = "../aidens-tool-kit" }
aidens-contracts = { path = "../aidens-contracts" }
aidens-memory-kit = { path = "../aidens-memory-kit" }
semantic-memory = { path = "../../../semantic-memory", default-features = false, features = ["brute-force"] }
knowledge-runtime = { path = "../../../knowledge-runtime" }
claim-ledger = { path = "../../../claim-ledger" }
stack-ids = { path = "../../../stack-ids" }
llm-output-parser = { path = "../../../llm-output-parser" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }