[package]
name = "aidens-autonomous"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Autonomous gap detection and task generation for closed-loop self-learning"

[dependencies]
aidens-daemon-kit = { version = "0.1.0", path = "../aidens-daemon-kit" }
aidens-queue-kit = { version = "0.1.0", path = "../aidens-queue-kit" }
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
aidens-memory-kit = { version = "0.1.0", path = "../aidens-memory-kit" }
aidens-runner = { version = "0.1.0", path = "../aidens-runner" }
aidens-governance-kit = { version = "0.1.0", path = "../aidens-governance-kit" }
semantic-memory = { version = "0.5.8", path = "../../../semantic-memory", default-features = false, features = ["brute-force"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
