[package]
name = "aidens-queue-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Append-only durable queue substrate for daemon execution"


[dependencies]
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
