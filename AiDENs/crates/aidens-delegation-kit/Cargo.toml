[package]
name = "aidens-delegation-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Delegation status surface (quarantined — status interface only)"


[dependencies]
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
