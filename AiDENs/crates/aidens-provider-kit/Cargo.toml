[package]
name = "aidens-provider-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Provider construction, execution, and route truth — Ollama, Mock, Disabled"


[dependencies]
aidens-contracts = { path = "../aidens-contracts" }
anyhow = "1"
async-trait = "0.1"
llm-tool-runtime = { version = "0.1.0", path = "../../../llm-tool-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
aidens-testkit = { path = "../aidens-testkit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
