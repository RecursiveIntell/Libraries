[package]
name = "aidens-tool-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Tool registry, exposure planning, and safe sandbox-validated dispatch"


[dependencies]
aidens-boundary-kit = { version = "0.1.0", path = "../aidens-boundary-kit" }
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
aidens-permit-kit = { version = "0.1.0", path = "../aidens-permit-kit" }
aidens-security-kit = { version = "0.1.0", path = "../aidens-security-kit" }
anyhow = "1"
async-trait = "0.1"
llm-tool-runtime = { version = "0.1.0", path = "../../../llm-tool-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
aidens-testkit = { version = "0.1.0", path = "../aidens-testkit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
