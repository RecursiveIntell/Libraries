[package]
name = "aidens-boundary-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Boundary compiler primitives — LLM structured output, canonical JSON digestion"


[dependencies]
aidens-contracts = { path = "../aidens-contracts" }
boundary-compiler-core = { path = "../boundary-compiler-core" }
boundary-compiler = { path = "../../../boundary-compiler" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
aidens-testkit = { path = "../aidens-testkit" }
