[package]
name = "aidens-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "AiDENs CLI — agent creation, doctor diagnostics, scaffold generation, receipt inspection"


[dependencies]
aidens-app-kit = { version = "0.1.0", path = "../aidens-app-kit" }
aidens-autonomous = { version = "0.1.0", path = "../aidens-autonomous" }
aidens-budget-kit = { version = "0.1.0", path = "../aidens-budget-kit" }
aidens-boundary-kit = { version = "0.1.0", path = "../aidens-boundary-kit" }
aidens-capability-kit = { version = "0.1.0", path = "../aidens-capability-kit" }
aidens-config = { version = "0.1.0", path = "../aidens-config" }
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
aidens-daemon-kit = { version = "0.1.0", path = "../aidens-daemon-kit" }
aidens-memory-kit = { version = "0.1.0", path = "../aidens-memory-kit" }
aidens-permit-kit = { version = "0.1.0", path = "../aidens-permit-kit" }
aidens-plan-kit = { version = "0.1.0", path = "../aidens-plan-kit" }
aidens-provider-kit = { version = "0.1.0", path = "../aidens-provider-kit" }
aidens-receipts = { version = "0.1.0", path = "../aidens-receipts" }
aidens-runner = { version = "0.1.0", path = "../aidens-runner" }
aidens-tool-kit = { version = "0.1.0", path = "../aidens-tool-kit" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
contract-schema-gen = { version = "0.1.0", path = "../../../contract-schema-gen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
