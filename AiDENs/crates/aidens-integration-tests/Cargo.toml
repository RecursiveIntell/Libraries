[package]
name = "aidens-integration-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "E2E integration tests proving the unified agent framework"


[dev-dependencies]
aidens-agency-kit = { path = "../aidens-agency-kit" }
aidens-boundary-kit = { path = "../aidens-boundary-kit" }
aidens-budget-kit = { path = "../aidens-budget-kit" }
aidens-app-kit = { path = "../aidens-app-kit" }
aidens-cli = { path = "../aidens-cli" }
aidens-contracts = { path = "../aidens-contracts" }
aidens-daemon-kit = { path = "../aidens-daemon-kit" }
aidens-governance-kit = { path = "../aidens-governance-kit" }
aidens-kernel-kit = { path = "../aidens-kernel-kit" }
aidens-memory-kit = { path = "../aidens-memory-kit" }
aidens-permit-kit = { path = "../aidens-permit-kit" }
aidens-provider-kit = { path = "../aidens-provider-kit" }
aidens-receipts = { path = "../aidens-receipts" }
aidens-repair-kit = { path = "../aidens-repair-kit" }
aidens-runner = { path = "../aidens-runner" }
aidens-testkit = { path = "../aidens-testkit" }
aidens-tool-kit = { path = "../aidens-tool-kit" }
async-trait = "0.1"
assurance-runtime = { version = "0.1.0", path = "../../../assurance-runtime" }
authority-delegation = { version = "0.1.0", path = "../../../authority-delegation" }
boundary-compiler-core = { path = "../boundary-compiler-core" }
chrono = { version = "0.4", features = ["serde"] }
constraint-compiler = { version = "0.1.0", path = "../../../constraint-compiler" }
forge-memory-bridge = { version = "0.1.0", path = "../../../forge-memory-bridge" }
kernel-execution = { version = "0.1.0", path = "../../../kernel-execution" }
kernel-oracles = { version = "0.1.0", path = "../../../kernel-oracles" }
knowledge-runtime = { version = "0.1.0", path = "../../../knowledge-runtime" }
llm-tool-runtime = { version = "0.1.0", path = "../../../llm-tool-runtime" }
recursive-kernel-core = { version = "0.1.0", path = "../../../recursive-kernel-core" }
semantic-memory = { version = "0.5.0", path = "../../../semantic-memory", default-features = false, features = ["brute-force"] }
semantic-memory-forge = { version = "0.1.0", path = "../../../semantic-memory-forge" }
serde_json = "1"
stack-ids = { version = "0.1.0", path = "../../../stack-ids" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
verification-adjudication = { version = "0.1.0", path = "../../../verification-adjudication" }
verification-calibration = { version = "0.1.0", path = "../../../verification-calibration" }
verification-control = { version = "0.1.0", path = "../../../verification-control" }
verification-policy = { version = "0.1.0", path = "../../../verification-policy" }
