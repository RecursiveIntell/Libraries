[package]
name = "aidens-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Config loading, validation, redaction, and atomic apply planning"


[dependencies]
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
aidens-testkit = { version = "0.1.0", path = "../aidens-testkit" }
