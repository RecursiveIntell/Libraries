[package]
name = "aidens-daemon-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Daemon facade for queue, schedule, wake, leases, and safe mode"


[dependencies]
aidens-contracts = { version = "0.1.0", path = "../aidens-contracts" }
aidens-queue-kit = { version = "0.1.0", path = "../aidens-queue-kit" }
aidens-schedule-kit = { version = "0.1.0", path = "../aidens-schedule-kit" }
aidens-wake-kit = { version = "0.1.0", path = "../aidens-wake-kit" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
