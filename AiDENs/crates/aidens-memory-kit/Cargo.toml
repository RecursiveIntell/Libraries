[package]
name = "aidens-memory-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Memory facade — search, graph, integrity, receipts over semantic-memory"


[dependencies]
forge-memory-bridge = { version = "0.1.0", path = "../../../forge-memory-bridge" }
knowledge-runtime = { version = "0.1.0", path = "../../../knowledge-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semantic-memory = { version = "0.5.0", path = "../../../semantic-memory", default-features = false, features = ["brute-force"] }
semantic-memory-forge = { version = "0.1.0", path = "../../../semantic-memory-forge" }
stack-ids = { version = "0.1.0", path = "../../../stack-ids" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
