[package]
name = "aidens-memory-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Memory facade — search, graph, integrity, receipts over semantic-memory"

[features]
# Enables SemanticMemoryAdapter with TurboQuant compressed search, graph traversal,
# integrity verification, and receipt replay wired through semantic-memory's full API.
semantic-memory-integration = ["semantic-memory/turbo-quant-codec"]

[dependencies]
forge-memory-bridge = { version = "0.1.1", path = "../../../forge-memory-bridge" }
knowledge-runtime = { version = "0.1.0", path = "../../../knowledge-runtime" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semantic-memory = { version = "0.5.10", path = "../../../semantic-memory", default-features = false, features = ["brute-force"] }
semantic-memory-forge = { version = "0.1.1", path = "../../../semantic-memory-forge" }
stack-ids = { version = "0.1.1", path = "../../../stack-ids" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
