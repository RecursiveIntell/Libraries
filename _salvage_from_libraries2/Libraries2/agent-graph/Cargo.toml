[package]
name = "agent-graph"
version = "0.2.0"
edition = "2021"
description = "Graph-based agent orchestration for Rust - LangGraph for the Rust ecosystem"
license = "MIT"
readme = "README.md"
keywords = ["ai", "llm", "agents", "graph", "workflow"]
categories = ["algorithms", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Database (for checkpointing)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for execution IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"

# Shared identity/trace primitives
stack-ids = { path = "../stack-ids" }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[features]
default = ["checkpointing"]
checkpointing = ["rusqlite"]

[[bench]]
name = "graph_bench"
harness = false
