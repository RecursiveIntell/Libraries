[package]
name = "claim-ledger-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for claim-ledger"

[[bin]]
name = "claim-ledger-mcp"
path = "src/main.rs"

[dependencies]
claim-ledger = { path = "../claim-ledger" }
rmcp = { version = "1", features = ["server", "transport-io"] }
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[lints]
workspace = true
