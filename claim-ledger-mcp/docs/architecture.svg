<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">claim-ledger-mcp server surface</title>
  <desc id="desc">An MCP client connects over stdio. The server routes to the claim-ledger operations: claim lifecycle, evidence, verification, and proof-debt, over a configured ledger directory.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="24" fill="#07111F"/>
  <rect width="1200" height="580" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">CLAIM-LEDGER MCP</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">stdio MCP server exposing claim lifecycle · evidence · verification · proof-debt to MCP clients</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260V196H540"/>
      <path d="M420 260V324H540"/>
      <path d="M420 260H540"/>
      <path d="M420 260V452H540"/>
      <path d="M700 260H780"/>
    </g>

    <!-- Client -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">MCP CLIENT</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="12">Hermes etc.</text>

    <!-- Server -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">MCP SERVER</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="13">stdio transport</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">claim-ledger-mcp</text>

    <!-- Operations -->
    <rect x="420" y="142" width="120" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="440" y="176" fill="#F9A8D4" font-size="12" font-weight="700">CLAIMS</text>
    <text x="440" y="204" fill="#FCE7F3" font-size="13">lifecycle</text>
    <text x="440" y="228" fill="#FBCFE8" font-size="11">create · supersede</text>

    <rect x="420" y="260" width="120" height="108" rx="12" fill="#162318" stroke="#84CC16" stroke-width="2"/>
    <text x="440" y="294" fill="#BEF264" font-size="12" font-weight="700">EVIDENCE</text>
    <text x="440" y="322" fill="#ECFCCB" font-size="13">bundles</text>
    <text x="440" y="346" fill="#94A3B8" font-size="11">link + prove</text>

    <rect x="420" y="378" width="120" height="108" rx="12" fill="#211E13" stroke="#FBBF24" stroke-width="2"/>
    <text x="440" y="412" fill="#FDE68A" font-size="12" font-weight="700">VERIFY</text>
    <text x="440" y="440" fill="#FEF3C7" font-size="13">+ proof-debt</text>
    <text x="440" y="464" fill="#94A3B8" font-size="11">risk-class gates</text>

    <!-- Ledger -->
    <rect x="540" y="206" width="160" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="560" y="240" fill="#C4B5FD" font-size="12" font-weight="700">CLAIM LEDGER</text>
    <text x="560" y="268" fill="#EDE9FE" font-size="13">ledger-dir</text>
    <text x="560" y="292" fill="#DDD6FE" font-size="11">claim-ledger crate</text>

    <!-- Response -->
    <rect x="780" y="206" width="364" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="240" fill="#C4B5FD" font-size="12" font-weight="700">MCP RESPONSE</text>
    <text x="800" y="268" fill="#EDE9FE" font-size="13">claim state · judgment · receipt</text>
    <text x="800" y="292" fill="#DDD6FE" font-size="11">over stdio back to client</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">AUTHORITY</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">claim-ledger owns claim truth · the MCP server is the transport/application surface, not a separate authority</text>
  </g>
</svg>
