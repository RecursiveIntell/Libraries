[package]
name = "agent-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Linux control plane for AI agent security — trait surface and receipt types for BPF LSM, cgroup v2, Landlock, and seccomp sandboxing"
readme = "README.md"
keywords = ["security", "sandbox", "agent", "linux", "landlock"]
categories = ["os::linux-apis", "api-bindings"]
repository = "https://github.com/RecursiveIntell/Libraries"
homepage = "https://github.com/RecursiveIntell/Libraries/agent-guard"

[features]
default = []
mcp = ["dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tokio = { version = "1.0", optional = true, features = ["sync"] }