[package]
name = "agent-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[features]
default = []
mcp = ["dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tokio = { version = "1.0", optional = true, features = ["sync"] }