[package]
name = "cea-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
bincode = "1"
blake3 = "1"
check-runner = { version = "0.1.0", path = "../check-runner" }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typed-patch = { version = "0.1.0", path = "../typed-patch" }

[dev-dependencies]
uuid = "1"
