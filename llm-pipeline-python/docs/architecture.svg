<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">llm-pipeline-python transport replacement</title>
  <desc id="desc">Hermes routes LLM requests through the Rust pipeline instead of raw Python httpx calls. LlmConfig and Pipeline are exposed via PyO3 with pyo3-async-runtimes for safe tokio bridging.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="24" fill="#07111F"/>
  <rect width="1200" height="580" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">LLM-PIPELINE PYTHON BINDINGS</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">Hermes routes LLM requests through the Rust pipeline · replaces raw Python httpx calls</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260H540"/>
      <path d="M700 260H780"/>
    </g>

    <!-- Hermes -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">HERMES</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="12">agent runtime</text>

    <!-- Bindings -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">PYO3</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="14">LlmConfig</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">Pipeline</text>

    <!-- Bridge -->
    <rect x="420" y="206" width="120" height="108" rx="12" fill="#11271F" stroke="#34D399" stroke-width="2"/>
    <text x="440" y="240" fill="#6EE7B7" font-size="12" font-weight="700">BRIDGE</text>
    <text x="440" y="268" fill="#ECFDF5" font-size="13">pyo3-async-</text>
    <text x="440" y="292" fill="#94A3B8" font-size="11">runtimes · tokio</text>

    <!-- Pipeline -->
    <rect x="540" y="206" width="160" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="560" y="240" fill="#F9A8D4" font-size="12" font-weight="700">RUST PIPELINE</text>
    <text x="560" y="268" fill="#FCE7F3" font-size="13">LlmCall + ExecCtx</text>
    <text x="560" y="292" fill="#FBCFE8" font-size="11">llm-pipeline crate</text>

    <!-- Result -->
    <rect x="780" y="206" width="364" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="240" fill="#C4B5FD" font-size="12" font-weight="700">LLM REQUEST/OUTCOME</text>
    <text x="800" y="268" fill="#EDE9FE" font-size="13">routed via Rust</text>
    <text x="800" y="292" fill="#DDD6FE" font-size="11">not raw httpx</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">CONFIG</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">LlmConfig exposes builder copies: with_temperature · with_max_tokens · with_thinking · with_json_mode</text>
  </g>
</svg>
