[package]
name = "llm-pipeline-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for llm-pipeline"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
llm-pipeline = { path = "../llm-pipeline" }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Override native-tls with rustls to prevent OpenSSL/Python ssl module conflict
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
