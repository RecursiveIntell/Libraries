<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">quant-eval benchmark pipeline</title>
  <desc id="desc">A benchmark config drives compression and semantic-search benchmarks. Results pass an admissibility test and produce receipt-bearing output that is reproducible and auditable.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#07111F"/>
  <rect width="1200" height="600" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">QUANT-EVAL BENCHMARK PIPELINE</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">receipt-bearing, reproducible evaluation of compression codecs and semantic-search backends</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260V196H540"/>
      <path d="M420 260V324H540"/>
      <path d="M540 260H620"/>
      <path d="M780 260H860"/>
    </g>

    <!-- Config -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">CONFIG</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="11">benchmark config</text>

    <!-- Runner -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">RUNNER</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="13">CompressionBench</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">SemanticMemoryBench</text>

    <!-- Benchmarks -->
    <rect x="420" y="142" width="120" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="440" y="176" fill="#F9A8D4" font-size="12" font-weight="700">CODEC</text>
    <text x="440" y="204" fill="#FCE7F3" font-size="13">compression eval</text>
    <text x="440" y="228" fill="#FBCFE8" font-size="11">CodecProfile</text>

    <rect x="420" y="260" width="120" height="108" rx="12" fill="#162318" stroke="#84CC16" stroke-width="2"/>
    <text x="440" y="294" fill="#BEF264" font-size="12" font-weight="700">SEARCH</text>
    <text x="440" y="322" fill="#ECFCCB" font-size="13">semantic eval</text>
    <text x="440" y="346" fill="#94A3B8" font-size="11">backends</text>

    <!-- Admissibility -->
    <rect x="540" y="206" width="160" height="108" rx="12" fill="#211E13" stroke="#FBBF24" stroke-width="2"/>
    <text x="560" y="240" fill="#FDE68A" font-size="12" font-weight="700">ADMISSIBILITY</text>
    <text x="560" y="268" fill="#FEF3C7" font-size="13">admissibility test</text>
    <text x="560" y="292" fill="#94A3B8" font-size="11">fingerprint env</text>

    <!-- Receipt -->
    <rect x="780" y="206" width="220" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="240" fill="#C4B5FD" font-size="12" font-weight="700">RECEIPT</text>
    <text x="800" y="268" fill="#EDE9FE" font-size="13">BenchmarkReceipt</text>
    <text x="800" y="292" fill="#DDD6FE" font-size="11">diffable · auditable</text>

    <!-- Claim -->
    <rect x="860" y="206" width="284" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="880" y="240" fill="#C4B5FD" font-size="12" font-weight="700">REPRODUCIBLE CLAIM</text>
    <text x="880" y="268" fill="#EDE9FE" font-size="13">synthetic vs real distinct</text>
    <text x="880" y="292" fill="#DDD6FE" font-size="11">no conflated results</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">INTENT</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">make performance claims receipt-bearing and reproducible — a synthetic result and a real-workload result are distinct auditable artifacts</text>
  </g>
</svg>
