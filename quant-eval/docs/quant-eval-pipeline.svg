<svg width="1120" height="560" viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">quant-eval evidence pipeline</title>
  <desc id="desc">A dark architecture diagram showing fixtures flowing through codec adapters into metrics, receipts, and downstream governance gates.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #020617; }
      .grid { fill: url(#grid); }
      .title { fill: #e2e8f0; font: 700 28px 'JetBrains Mono', ui-monospace, monospace; }
      .subtitle { fill: #94a3b8; font: 13px 'JetBrains Mono', ui-monospace, monospace; }
      .box-title { fill: #f8fafc; font: 700 16px 'JetBrains Mono', ui-monospace, monospace; }
      .box-text { fill: #cbd5e1; font: 12px 'JetBrains Mono', ui-monospace, monospace; }
      .tiny { fill: #94a3b8; font: 10px 'JetBrains Mono', ui-monospace, monospace; }
      .boundary-title { fill: #fbbf24; font: 700 12px 'JetBrains Mono', ui-monospace, monospace; }
      .fixture { fill: rgba(8, 51, 68, 0.72); stroke: #22d3ee; }
      .codec { fill: rgba(6, 78, 59, 0.72); stroke: #34d399; }
      .metrics { fill: rgba(76, 29, 149, 0.72); stroke: #a78bfa; }
      .receipt { fill: rgba(120, 53, 15, 0.72); stroke: #fbbf24; }
      .policy { fill: rgba(136, 19, 55, 0.68); stroke: #fb7185; }
      .box { rx: 12; stroke-width: 1.7; filter: url(#glow); }
      .arrow { stroke: #38bdf8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #34d399; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .boundary { fill: rgba(15, 23, 42, 0.35); stroke: #fbbf24; stroke-width: 1.4; stroke-dasharray: 8 5; rx: 18; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="560"/>
  <rect class="grid" width="1120" height="560" opacity="0.7"/>

  <text x="48" y="54" class="title">quant-eval evidence pipeline</text>
  <text x="48" y="80" class="subtitle">fixture-driven measurement before codec promotion, governor policy, or runtime integration</text>

  <rect x="34" y="110" width="1052" height="330" class="boundary"/>
  <text x="58" y="135" class="boundary-title">local, deterministic benchmark boundary — no production or model-quality claims</text>

  <path d="M 242 246 C 282 246, 296 246, 336 246" class="arrow"/>
  <path d="M 546 246 C 586 246, 598 246, 638 246" class="arrow"/>
  <path d="M 822 218 C 858 202, 886 192, 922 186" class="arrow-green"/>
  <path d="M 822 276 C 858 294, 886 304, 922 314" class="arrow-green"/>

  <rect x="70" y="170" width="172" height="152" class="box fixture"/>
  <text x="94" y="204" class="box-title">Fixtures</text>
  <text x="94" y="232" class="box-text">synthetic vectors</text>
  <text x="94" y="254" class="box-text">RAG relevance sets</text>
  <text x="94" y="276" class="box-text">A2 lattice points</text>
  <text x="94" y="306" class="tiny">seeded, reproducible</text>

  <rect x="336" y="154" width="210" height="184" class="box codec"/>
  <text x="364" y="190" class="box-title">Codec adapters</text>
  <text x="364" y="220" class="box-text">HyperQuant Z1/A2</text>
  <text x="364" y="244" class="box-text">future codec-core</text>
  <text x="364" y="268" class="box-text">future turbo/fib</text>
  <text x="364" y="308" class="tiny">encode → decode → compare</text>

  <rect x="638" y="154" width="184" height="184" class="box metrics"/>
  <text x="664" y="190" class="box-title">Metrics</text>
  <text x="664" y="220" class="box-text">MSE / max MSE</text>
  <text x="664" y="244" class="box-text">recall@k / MRR</text>
  <text x="664" y="268" class="box-text">NDCG / recovery</text>
  <text x="664" y="308" class="tiny">numbers before claims</text>

  <rect x="922" y="126" width="128" height="120" class="box receipt"/>
  <text x="944" y="162" class="box-title">Receipts</text>
  <text x="944" y="192" class="box-text">JSON</text>
  <text x="944" y="214" class="box-text">digests</text>
  <text x="944" y="236" class="tiny">replayable</text>

  <rect x="922" y="278" width="128" height="120" class="box policy"/>
  <text x="944" y="314" class="box-title">Policy</text>
  <text x="944" y="344" class="box-text">governor</text>
  <text x="944" y="366" class="box-text">admission</text>
  <text x="944" y="388" class="tiny">no silent promotion</text>

  <rect x="66" y="466" width="988" height="50" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155"/>
  <text x="94" y="496" class="box-text">Rule: benchmarks produce evidence; evidence gates integration; truth-bearing stores keep exact fallback.</text>
</svg>
