[package]
name = "quant-eval"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Compression and semantic search evaluation benchmark suite — codec admissibility, compression ratios, and retrieval quality"
license = "MIT"
authors = ["sikmindz"]
readme = "README.md"
repository = "https://github.com/RecursiveIntell/Libraries"
homepage = "https://github.com/RecursiveIntell/Libraries"
documentation = "https://docs.rs/quant-eval"
keywords = ['benchmark', 'compression', 'semantic-search', 'quantization', 'evaluation']
categories = ['development-tools']

[dependencies]
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
sha2 = "0.10"
blake3 = "1.8.3"
hyperquant = { version = "0.1.0", path = "../hyperquant" }
compressed-scorer = { version = "0.1.0", path = "../compressed-scorer", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[[test]]
name = "integration"
path = "tests/integration.rs"