[package]
name = "cea-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "JSON stdin/stdout bridge for real CEA causal graph operations (read-only)"

[dependencies]
cea-core = { version = "0.1.0", path = "../Primitives/cea-core" }
cea-store = { version = "0.1.0", path = "../Primitives/cea-store" }
cea-sqlite = { version = "0.1.0", path = "../Primitives/cea-sqlite" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
check-runner = { version = "0.1.0", path = "../Primitives/check-runner" }
tempfile = "3"

[workspace]
