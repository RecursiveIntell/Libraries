name: Context Governor closure source export (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-closure-source-once.yml'
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'repair/context-governor-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b63a341ea0e947979fac40302050804d52ae2bdb
          path: libraries
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: RecursiveIntell/Ares
          ref: fa74bfdb98e541fe719bb0f99f6bd44bce034f44
          path: ares
          persist-credentials: false
      - name: Archive only tracked audit source, never credentials or live state
        shell: bash
        run: |
          set -euo pipefail
          mkdir export
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          pins = {'libraries': 'b63a341ea0e947979fac40302050804d52ae2bdb', 'ares': 'fa74bfdb98e541fe719bb0f99f6bd44bce034f44'}
          manifest = {}
          for repo, pin in pins.items():
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=repo, text=True).strip() == pin
              paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=repo).decode().split('\0')
              selected = []
              for p in paths:
                  if not p or any(part in {'.hermes', '.env', 'node_modules', 'target'} for part in pathlib.PurePosixPath(p).parts):
                      continue
                  if repo == 'libraries':
                      keep = p.startswith(('context-governor/', 'scripts/', '.github/')) or '/' not in p
                  else:
                      keep = p.endswith(('.py', '.toml', '.lock', '.sh')) or p.startswith('.github/') or pathlib.PurePosixPath(p).name in {'AGENTS.md', 'CLAUDE.md', 'SKILL.md'}
                  if keep:
                      selected.append(p)
              out = pathlib.Path('export') / (repo + '.tar.gz')
              with out.open('wb') as handle:
                  subprocess.run(['git', 'archive', '--format=tar.gz', pin, '--', *selected], cwd=repo, stdout=handle, check=True)
              manifest[repo] = {'commit': pin, 'archive_sha256': hashlib.sha256(out.read_bytes()).hexdigest(), 'tracked_paths': selected}
          pathlib.Path('export/manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: context-governor-pinned-audit-source
          path: export/
          retention-days: 3
          if-no-files-found: error
