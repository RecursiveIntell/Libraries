name: Constitutive witness (experimental)
on:
  pull_request:
    paths:
      - 'constitutive-witness/**'
      - 'receipt-bench/fixtures/falsify/**'
      - '.github/workflows/constitutive-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain
        run: rustc --version && cargo --version
      - name: Test isolated kernel without network dependencies
        run: cargo test --manifest-path constitutive-witness/Cargo.toml --locked --offline
      - name: Build actual CLI
        run: cargo build --manifest-path constitutive-witness/Cargo.toml --locked --offline
      - name: Independently check all native corpus certificates
        run: python3 receipt-bench/fixtures/falsify/check_corpus.py --binary constitutive-witness/target/debug/constitutive-witness
