name: Constitutive witness (experimental)
on:
  pull_request:
    paths:
      - 'constitutive-witness/**'
      - 'receipt-bench/fixtures/falsify/**'
      - '.github/workflows/constitutive-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain
        run: rustc --version && cargo --version
      - name: Test isolated kernel without network dependencies
        run: cargo test --manifest-path constitutive-witness/Cargo.toml --locked --offline
      - name: Exercise real CLI energy separator
        shell: bash
        run: |
          set -euo pipefail
          printf 'CW1 1 1 0 100\n-1/1\n1/1\n' | cargo run --quiet --manifest-path constitutive-witness/Cargo.toml --locked --offline > /tmp/cw-result.json
          python3 -c 'import json; x=json.load(open("/tmp/cw-result.json")); assert x["kind"] == "dual" and x["values"] == ["1/1"]'
