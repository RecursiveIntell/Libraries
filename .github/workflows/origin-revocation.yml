name: origin-revocation-coherence
on:
  pull_request:
    paths:
      - 'semantic-memory/**'
      - '.github/workflows/origin-revocation.yml'
jobs:
  owner-regressions:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p semantic-memory -- --check
      - run: cargo test --locked -p semantic-memory --no-default-features --features testing,brute-force --test origin_authority --test governed_witness_v2 --test authority_transactions
      - run: cargo clippy --locked -p semantic-memory --no-default-features --features testing,brute-force --test origin_authority --test governed_witness_v2 -- -D warnings
