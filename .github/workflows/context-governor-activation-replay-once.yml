name: Apply Context Governor activation replay (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-activation-replay-once.yml'
      - '.cg-closure/activation-replay.patch.b64'
permissions:
  contents: write
concurrency:
  group: context-governor-activation-replay
  cancel-in-progress: false
jobs:
  apply:
    if: github.head_ref == 'repair/context-governor-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: context-governor
      - name: Apply exact replay patch, validate, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          source = pathlib.Path('.cg-closure/activation-replay.patch.b64')
          raw = gzip.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          expected = '005adcdf72d2d3d71e65079ba48114913bfbba786ef1dab4a6d8350ec764009d'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'activation patch digest mismatch: {actual}')
          subprocess.run(['git','apply','--check','-'], input=raw, check=True)
          subprocess.run(['git','apply','-'], input=raw, check=True)
          PY
          (cd context-governor && cargo fmt)
          git diff --check
          (cd context-governor && cargo test --locked --test lineage activation)
          (cd context-governor && cargo test --locked --all-targets --all-features)
          (cd context-governor && cargo clippy --locked --all-targets --all-features -- -D warnings)
          git config user.name 'Context Governor Closure'
          git config user.email 'context-governor-closure@users.noreply.github.com'
          git add context-governor/src/lineage.rs context-governor/tests/lineage.rs
          git commit -m 'fix(context-governor): make exact receipt activation replay idempotent'
          git push origin HEAD:repair/context-governor-closure-20260909
