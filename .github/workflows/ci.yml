name: hardening-and-v25

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hardening-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ripgrep
      - run: python3 scripts/check_action_pinning.py
      - run: python3 scripts/check_supply_chain_policy.py
      - run: cargo metadata --no-deps --format-version 1 | python3 scripts/check_workspace_hygiene.py
      - run: make gate

  # Security gate: fails on vulnerability-grade advisories (CVEs, soundness
  # issues) and yanked crate versions. Tauri/webkit2gtk transitive
  # unmaintained-warnings are explicitly tolerated per deny.toml policy.
  # Runs in parallel with hardening-gate so it doesn't gate regular builds.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # Use deny.toml at the workspace root. The action already passes
          # manifest-path separately, so arguments must not repeat it.
          arguments: --workspace

  v25-production-closure:
    runs-on: ubuntu-latest
    needs: hardening-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash scripts/check_v25_repo_truth.sh
      - run: python3 scripts/check_v25_json_surface.py
      - run: bash scripts/check_no_local_recomposition.sh
      - run: python3 scripts/check_v25_production_closure.py
      - run: bash scripts/run_v25_local_checks.sh
