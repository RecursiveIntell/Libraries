name: hardening-and-v25

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  hardening-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make gate

  v25-production-closure:
    runs-on: ubuntu-latest
    needs: hardening-gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_v25_repo_truth.sh
      - run: python3 scripts/check_v25_json_surface.py
      - run: bash scripts/check_no_local_recomposition.sh
      - run: python3 scripts/check_v25_production_closure.py
      - run: bash scripts/run_v25_local_checks.sh
