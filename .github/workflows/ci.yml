name: hardening-and-release

on:
  push:
    branches:
      - main
      - master
      - feat/full-integration
  pull_request:

jobs:
  hardening-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make gate

  # CI-001: Certify every required workspace independently.
  workspace-matrix:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - root
          - AiDENs
          - Primitives
          - poly-kv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The root workspace pulls Tauri (via ai-batch-queue, stack-monitor-desktop,
      # and tauri-queue), whose glib-sys/gtk-sys build scripts shell out to
      # pkg-config. Without these system packages `cargo clippy --workspace`
      # fails before any crate of ours is checked. See
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config
      - name: Workspace ${{ matrix.workspace }}
        run: |
          if [ "${{ matrix.workspace }}" = "root" ]; then
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-targets --all-features
            cargo doc --workspace --no-deps
          else
            cd ${{ matrix.workspace }}
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-targets --all-features
            cargo doc --workspace --no-deps
          fi

  # CI-001: Alternative feature lanes for semantic-memory.
  feature-lanes:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features --features brute-force"
          - "--no-default-features --features hnsw"
          - "--no-default-features --features brute-force,turbo-quant-codec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: semantic-memory ${{ matrix.features }}
        run: |
          cargo test -p semantic-memory ${{ matrix.features }}
          cargo clippy -p semantic-memory ${{ matrix.features }} --all-targets -- -D warnings

  # CI-001: scr-runtime-compression feature lanes.
  codec-feature-lanes:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features turbo"
          - "--no-default-features --features fib"
          - "--all-features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: scr-runtime-compression ${{ matrix.features }}
        run: cargo test -p scr-runtime-compression ${{ matrix.features }}

  v25-production-closure:
    runs-on: ubuntu-latest
    needs: [hardening-gate, workspace-matrix, feature-lanes, codec-feature-lanes]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_v25_repo_truth.sh
      - run: python3 scripts/check_v25_json_surface.py
      - run: bash scripts/check_no_local_recomposition.sh
      - run: python3 scripts/check_v25_production_closure.py
      - run: bash scripts/run_v25_local_checks.sh
