name: hardening-and-release

on:
  push:
    branches:
      - main
      - master
      - feat/full-integration
  pull_request:

jobs:
  agent-network-rust188:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-network-rust188
      - name: Verify exact network minimum toolchain
        run: |
          python3 -c 'import subprocess; actual = subprocess.check_output(["rustc", "--version"], text=True); print(actual); assert actual.split()[1] == "1.88.0"'
          python3 -c 'from pathlib import Path; import tomllib; names = ["stack-ids", "boundary-compiler", "agent-graph", "agent-graph-mcp", "agent-collaboration-contract", "agent-collaboration-transport"]; actual = {n: tomllib.loads((Path(n) / "Cargo.toml").read_text())["package"].get("rust-version") for n in names}; print(actual); assert all(v == "1.88" for v in actual.values())'
      - name: Locked network minimum-toolchain validation
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo check -p stack-ids -p boundary-compiler -p agent-graph -p agent-graph-mcp -p agent-collaboration-contract -p agent-collaboration-transport --all-targets --locked
          cargo test -p stack-ids -p boundary-compiler -p agent-graph -p agent-graph-mcp -p agent-collaboration-contract -p agent-collaboration-transport --all-targets --locked
          cargo clippy -p agent-collaboration-transport --all-targets --locked -- -D warnings
          cargo fmt -p agent-collaboration-transport -- --check
          git diff --exit-code -- Cargo.lock

  hardening-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make gate

  # CI-001: Certify every required workspace independently.
  workspace-matrix:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - root
          - AiDENs
          - Primitives
          - poly-kv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workspace ${{ matrix.workspace }}
        run: |
          if [ "${{ matrix.workspace }}" = "root" ]; then
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-targets --all-features
            cargo doc --workspace --no-deps
          else
            cd ${{ matrix.workspace }}
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-targets --all-features
            cargo doc --workspace --no-deps
          fi

  # CI-001: Alternative feature lanes for semantic-memory.
  feature-lanes:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features --features brute-force"
          - "--no-default-features --features hnsw"
          - "--no-default-features --features brute-force,turbo-quant-codec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: semantic-memory ${{ matrix.features }}
        run: |
          cargo test -p semantic-memory ${{ matrix.features }}
          cargo clippy -p semantic-memory ${{ matrix.features }} --all-targets -- -D warnings

  # CI-001: scr-runtime-compression feature lanes.
  codec-feature-lanes:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features turbo"
          - "--no-default-features --features fib"
          - "--all-features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: scr-runtime-compression ${{ matrix.features }}
        run: cargo test -p scr-runtime-compression ${{ matrix.features }}

  v25-production-closure:
    runs-on: ubuntu-latest
    needs: [hardening-gate, workspace-matrix, feature-lanes, codec-feature-lanes]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_v25_repo_truth.sh
      - run: python3 scripts/check_v25_json_surface.py
      - run: bash scripts/check_no_local_recomposition.sh
      - run: python3 scripts/check_v25_production_closure.py
      - run: bash scripts/run_v25_local_checks.sh
