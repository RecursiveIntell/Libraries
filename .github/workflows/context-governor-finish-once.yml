name: Apply staged Context Governor closure (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/context-governor-finish-once.yml'
      - '.cg-closure/failure-envelope.patch.b64'
      - '.cg-closure/v3-verifier.patch.b64'
permissions:
  contents: write
concurrency:
  group: context-governor-staged-closure
  cancel-in-progress: false
jobs:
  apply:
    if: github.head_ref == 'repair/context-governor-closure-20260909' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: context-governor
      - name: Apply hash-pinned stages and push each tested checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Context Governor Closure'
          git config user.email 'context-governor-closure@users.noreply.github.com'
          apply_stage() {
            local file="$1" expected="$2" message="$3" testcmd="$4"
            [ -f "$file" ] || return 0
            local patch="$RUNNER_TEMP/$(basename "$file" .b64)"
            python3 - "$file" "$patch" "$expected" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          source, dest, expected = sys.argv[1:]
          raw = gzip.decompress(base64.b64decode(pathlib.Path(source).read_text().strip(), validate=True))
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual} != {expected}')
          pathlib.Path(dest).write_bytes(raw)
          PY
            git apply --check "$patch"
            git apply "$patch"
            rm -f "$file"
            (cd context-governor && cargo fmt)
            git diff --check
            bash -lc "$testcmd"
            git add -A
            git commit -m "$message"
            git push origin HEAD:repair/context-governor-closure-20260909
          }
          apply_stage \
            .cg-closure/failure-envelope.patch.b64 \
            5d5bd3d13c9438f16847de6e9d1e9b2a725af314bb4170b5d61b914dad2edf5e \
            'feat(context-governor): add negotiated typed CLI failure envelope' \
            'cd context-governor && cargo test --locked --test cli && cargo clippy --locked --all-targets --all-features -- -D warnings'
          apply_stage \
            .cg-closure/v3-verifier.patch.b64 \
            d603dc8148e187e900526d37fac8eafb2bf0802ec0d2507dc19ab906e27bafe8 \
            'fix(context-governor): verify complete V3 projections against V2 authority' \
            'cd context-governor && cargo test --locked --test v3_regressions && cargo test --locked --all-targets --all-features && cargo clippy --locked --all-targets --all-features -- -D warnings'
          if [ ! -f .cg-closure/failure-envelope.patch.b64 ] && [ ! -f .cg-closure/v3-verifier.patch.b64 ]; then
            echo 'staged patches fully applied'
          fi
