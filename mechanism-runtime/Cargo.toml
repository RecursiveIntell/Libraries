[package]
name = "mechanism-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Typed mechanism/theory surface crate with bounded fit and refuter evaluators; not a standalone runtime"
license = "MIT"

[dependencies]
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
stack-ids = { path = "../stack-ids" }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
