[package]
name = "stack-monitor-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Ares Observatory read-side desktop shell for stack-monitor"
license = "MIT"

[lib]
name = "stack_monitor_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "stack-monitor-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
stack-observation = { version = "0.1.0", path = "../stack-observation" }
stack-monitor = { version = "0.1.0", path = "../stack-monitor", features = ["agent-graph-bridge"] }
tauri = { version = "2", features = [] }
thiserror = { workspace = true }
