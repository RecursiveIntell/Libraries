[package]
name = "agent-collaboration-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Authenticated bounded transport for governed local agent collaboration"

[dependencies]
agent-collaboration-contract = { version = "0.1.0", path = "../agent-collaboration-contract" }
boundary-compiler = { version = "0.1.0", path = "../boundary-compiler" }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stack-ids = { version = "0.1.3", path = "../stack-ids" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
