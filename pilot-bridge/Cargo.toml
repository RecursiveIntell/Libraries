[package]
name = "pilot-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "JSON stdin/stdout bridge for forge-pilot closed-loop evaluation"

[dependencies]
forge-pilot = { path = "../forge-pilot" }
forge-engine = { path = "../living-memory/living-memory" }
knowledge-runtime = { path = "../knowledge-runtime" }
semantic-memory = { path = "../semantic-memory" }
blake3 = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[workspace]
