[workspace]
# Standalone crate — not part of the parent Libraries workspace.

[package]
name = "poly-kv"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.75"
description = "Shared compressed KV-cache pool for multi-agent context. Two-tier codec policy (fib-quant cold + turbo-quant hot) with typed receipts."
license = "MIT"
repository = "https://github.com/RecursiveIntell/poly-kv"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"

turbo-quant = { path = "../../Libraries/turbo-quant", optional = true }
fib-quant = { path = "../../Libraries/fib-quant", optional = true }
gpu-backend = { path = "../../Libraries/gpu-backend", optional = true }
rayon = "1.10"

[features]
# Default features: turbo + fib codec adapters + parallel pool build.
# The parallel_pool path gives 15-40x speedup on multi-core machines
# (SIMD + Rayon over vectors + Rayon over layers). Disable parallel
# (set default-features = false) to pin to single-threaded for embedded.
default = ["turbo", "fib", "parallel_pool"]
turbo = ["turbo-quant"]
fib = ["fib-quant"]
gpu = ["gpu-backend/gpu", "turbo-quant?/gpu", "fib-quant?/gpu"]
# Enable fib-quant's GPU codebook_lookup path. Off by default; see fib-quant
# Cargo.toml for the rationale on per-call H2D/D2H overhead.
gpu_codebook_lookup = ["fib-quant?/gpu_codebook_lookup", "gpu"]
# Parallelize the poly-kv outer layer loop using Rayon. The 28 layers
# in qwen3 are independent; spreading them across cores compounds the
# fib-quant Rayon wins.
parallel_pool = ["fib-quant?/parallel"]

[dev-dependencies]
proptest = "1"
