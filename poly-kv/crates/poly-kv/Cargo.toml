[package]
name = "poly-kv"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "Shared compressed KV-cache pool for Rust: two-tier codec policy (fib-quant cold + turbo-quant hot) with typed receipts"
authors = ["sikmindz"]
readme = "README.md"
repository = "https://github.com/RecursiveIntell/poly-kv"
homepage = "https://github.com/RecursiveIntell/poly-kv"
documentation = "https://docs.rs/poly-kv"
keywords = ["kv-cache", "compression", "llm", "multi-agent", "pool", "fib-quant", "turbo-quant"]
categories = ["compression", "data-structures", "memory-management"]

[dependencies]
quant-codec-core = { version = "0.1.0-alpha.1", path = "../quant-codec-core" }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "1"
blake3 = "1"
criterion = { version = "0.5", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "quant-codec-core/serde"]
turbo-quant-adapter = []
fibquant-adapter = []
bench = ["dep:criterion"]
gpu = []

[[bench]]
name = "synthetic_pool"
harness = false
required-features = ["bench"]
