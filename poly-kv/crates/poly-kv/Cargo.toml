[package]
name = "poly-kv"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "Shared compressed KV-cache pool infrastructure for Rust experiments."

[dependencies]
quant-codec-core = { path = "../quant-codec-core", features = ["serde"] }
fib-quant = { path = "../../../fib-quant", optional = true, features = ["kv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
blake3 = "1"
bincode = { version = "2", features = ["serde"] }
criterion = { version = "0.5", optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = ["serde"]
serde = ["quant-codec-core/serde"]
turbo-quant-adapter = []
fibquant-adapter = ["dep:fib-quant", "serde"]
bench = ["dep:criterion"]

[[bench]]
name = "fibquant_paths"
harness = false
required-features = ["bench", "fibquant-adapter"]

[[bench]]
name = "synthetic_pool"
harness = false
required-features = ["bench"]
