[package]
name = "poly-kv-python"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "Optional PyO3 sidecar bindings for poly-kv bulk receipt experiments."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
poly-kv = { path = "../poly-kv" }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
