[package]
name = "agent-graph-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "MCP server exposing agent-graph + llm-pipeline for graph-orchestrated LLM workflows — typed rmcp tools, parallel fan-out, interrupt/resume, durable persistence"

[dependencies]
agent-graph = { version = "0.2.0", path = "../agent-graph" }
llm-pipeline = { version = "0.3.0", path = "../llm-pipeline", features = ["openai"] }
async-trait = "0.1"
rmcp = { version = "1", features = ["server", "transport-io"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
libc = "0.2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
stack-monitor = { path = "../stack-monitor", features = ["agent-graph-bridge"], optional = true }

[features]
default = []
observability = ["dep:stack-monitor"]

[dev-dependencies]
tempfile = "3"
# Keep workspace test builds on the last non-yanked semantic-memory release.
semantic-memory = { version = "0.5.14", path = "../semantic-memory" }

[lints]
workspace = true
