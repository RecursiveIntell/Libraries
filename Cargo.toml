# LIB-005: Workspace-level lint enforcement — compile-time law, not just scripts.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
expect_used = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1.89"
blake3 = "1.8.3"
sha2 = "0.10"
chrono = "0.4.44"
