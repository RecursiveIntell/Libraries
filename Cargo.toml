# Machine-readable expectations checked against live Cargo metadata, Git refs,
# the workflow release branch, support documents, and the closeout receipt by
# `python3 scripts/run_release_gates.py --check-drift`.
[workspace.metadata.release-truth]
workspace-package-count = 64
default-member-count = 59
release-branch = "main"
feature-graph-sha256 = "d2b73a92c0b232baecf8bb862d980b0159b327ed45cdd288e66fed5483e5b18d"
supported-closeout-members = [
    "contract-schema-gen",
    "forge-memory-bridge",
    "forge-pilot",
    "kernel-conformance",
    "kernel-execution",
    "kernel-oracles",
    "knowledge-runtime",
    "living-memory/living-memory",
    "llm-tool-runtime",
    "recursive-kernel-core",
    "semantic-memory",
    "semantic-memory-forge",
    "stack-ids",
    "verification-adjudication",
    "verification-calibration",
    "verification-control",
    "verification-policy",
]
adjacent-members = [
    "assurance-runtime",
    "attestation-exchange",
    "authority-delegation",
    "constitutional-memory",
    "continuity-runtime",
    "discovery-portfolio",
    "effect-runtime",
    "federated-settlement",
    "mechanism-runtime",
    "profile-runtime",
    "remote-oracle-admission",
    "spec-execution",
]

[[workspace.metadata.release-truth.known-limitations]]
id = "attestation-exchange-governance-observation"
package = "attestation-exchange"
status = "not-observed"
source = "SCOPE_NOTES.md"

# LIB-005: Workspace-level lint enforcement — compile-time law, not just scripts.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
expect_used = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1.89"
blake3 = "1.8.3"
sha2 = "0.10"
chrono = "0.4.44"
proptest = "1.10.0"
rusqlite = "0.32.1"
schemars = "0.8.22"
serde = "1.0.228"
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.22.0"
