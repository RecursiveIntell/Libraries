exclude = [
    # Nested workspace consumed only through path dependencies.
    "poly-kv",
    # TypeScript package — not a Rust crate
    "tauri-react-hooks",
    # Demo subcrate that does not exist on disk
    "demo-tauri-libraries/src-tauri",
    # Submodule — out of sync feature set with workspace
]
