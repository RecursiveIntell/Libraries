<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">agent-graph-python binding architecture</title>
  <desc id="desc">Python code calls PyO3 bindings that wrap the Rust agent-graph engine. A shared multi-threaded tokio runtime drives the graph; values cross the boundary as JSON.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#07111F"/>
  <rect width="1200" height="600" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">AGENT-GRAPH PYTHON BINDINGS</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">PyO3 bindings expose the Rust graph-orchestration engine to Python · JSON boundary + shared tokio runtime</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 260H276"/>
      <path d="M420 260H540"/>
      <path d="M540 260V180H660"/>
      <path d="M540 260V340H660"/>
      <path d="M820 260H900"/>
      <path d="M420 440V480H900"/>
    </g>

    <!-- Python -->
    <rect x="56" y="206" width="146" height="108" rx="54" fill="#172033" stroke="#A78BFA" stroke-width="2"/>
    <text x="129" y="252" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">PYTHON</text>
    <text x="129" y="279" text-anchor="middle" fill="#C4B5FD" font-size="12">caller code</text>

    <!-- Bindings -->
    <rect x="276" y="206" width="144" height="108" rx="12" fill="#102333" stroke="#22D3EE" stroke-width="2"/>
    <text x="296" y="240" fill="#67E8F9" font-size="12" font-weight="700">PYO3 BINDINGS</text>
    <text x="296" y="268" fill="#ECFEFF" font-size="14">AgentState</text>
    <text x="296" y="292" fill="#94A3B8" font-size="11">event sink · streams</text>

    <!-- JSON bridge -->
    <rect x="420" y="206" width="120" height="108" rx="12" fill="#11271F" stroke="#34D399" stroke-width="2"/>
    <text x="440" y="240" fill="#6EE7B7" font-size="12" font-weight="700">JSON</text>
    <text x="440" y="268" fill="#ECFDF5" font-size="13">serde</text>
    <text x="440" y="292" fill="#94A3B8" font-size="11">boundary</text>

    <!-- Rust engine -->
    <rect x="540" y="126" width="280" height="108" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="560" y="160" fill="#F9A8D4" font-size="12" font-weight="700">RUST AGENT-GRAPH</text>
    <text x="560" y="188" fill="#FCE7F3" font-size="14">workflow engine</text>
    <text x="560" y="212" fill="#FBCFE8" font-size="11">graph build · validate · execute</text>

    <rect x="540" y="260" width="280" height="108" rx="12" fill="#162318" stroke="#84CC16" stroke-width="2"/>
    <text x="560" y="294" fill="#BEF264" font-size="12" font-weight="700">SHARED TOKIO RUNTIME</text>
    <text x="560" y="322" fill="#ECFCCB" font-size="14">2 worker threads</text>
    <text x="560" y="346" fill="#94A3B8" font-size="11">OnceLock-initialized</text>

    <!-- Event sink -->
    <rect x="900" y="206" width="244" height="108" rx="12" fill="#171D31" stroke="#A78BFA" stroke-width="2"/>
    <text x="920" y="240" fill="#C4B5FD" font-size="12" font-weight="700">EVENTS + STATE</text>
    <text x="920" y="268" fill="#EDE9FE" font-size="14">ChannelEventSink</text>
    <text x="920" y="292" fill="#DDD6FE" font-size="11">graph events · stream events</text>

    <rect x="56" y="480" width="844" height="56" rx="10" fill="#101A28" stroke="#334155"/>
    <text x="76" y="507" fill="#CBD5E1" font-size="12" font-weight="700">DESIGN</text>
    <text x="76" y="528" fill="#94A3B8" font-size="12">bindings wrap Rust AgentState and stream primitives so Python builds and runs graph workflows without dropping into Rust</text>
  </g>
</svg>
