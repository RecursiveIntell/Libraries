[package]
name = "semantic-memory"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Hybrid semantic search with SQLite, FTS5, and HNSW — built for AI agents"
license = "MIT"
repository = "https://www.github.com/recursiveintell/semantic-memory"
homepage = "https://www.github.com/recursiveintell/semantic-memory"
keywords = ["search", "semantic", "sqlite", "hnsw", "embeddings"]
categories = ["database", "text-processing"]
readme = "README.md"

[features]
default = ["hnsw"]
hnsw = ["dep:hnsw_rs"]
brute-force = []
testing = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
rusqlite = { workspace = true, features = ["bundled", "blob"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
stack-ids = { path = "../stack-ids" }
forge-memory-bridge = { path = "../forge-memory-bridge" }
schemars = { workspace = true }

# HNSW approximate nearest neighbor search (optional)
hnsw_rs = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
semantic-memory-forge = { path = "../semantic-memory-forge" }

# LIB-005: inherit workspace lint policy
[lints]
workspace = true
